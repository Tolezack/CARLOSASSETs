<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARLOS Map Maker</title><link rel="stylesheet" href="./mapmaker.css"></head><body><header><b>CARLOS</b> MAP MAKER <span id="status">CARREGANDO...</span></header><main><aside><h2>Mapa</h2><label>Nome<input id="mapName"></label><label>Largura<input id="mapX" type="number" min="40"></label><label>Profundidade<input id="mapZ" type="number" min="40"></label><h3>Ferramenta</h3><div class="tools"><button data-tool="wall">Parede</button><button data-tool="cover">Cobertura</button><button data-tool="spawnA">Spawn A</button><button data-tool="spawnB">Spawn B</button><button data-tool="siteA">Site A</button><button data-tool="siteB">Site B</button><button data-tool="erase">Apagar</button></div><p>Arraste no mapa para paredes/coberturas. Clique para spawns/sites. Use roda para zoom.</p><button id="save" class="save">SALVAR MAPA</button><button id="reload">RECARREGAR</button><div id="message"></div></aside><section><canvas id="canvas"></canvas></section></main><script type="module" src="./mapmaker.js"></script></body></html>
